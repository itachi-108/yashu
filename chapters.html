<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chapters 📖</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <audio id="bg-music" loop preload="auto"></audio>

    <main class="container chapters-layout">
        <h1 class="page-title">The Story of Us</h1>

        <!-- Chapter Cards Grid -->
        <div class="grid-container">
            <!-- Chapter 1 is unlocked by default and glowing -->
            <div id="chapter-card-1" class="chapter-card glass-card unlocked-glow" onclick="openModal(1)">
                <span class="chapter-number">I</span>
                <span class="chapter-title">THE BOND</span>
            </div>
            
            <!-- Chapter 2 is locked -->
            <div id="chapter-card-2" class="chapter-card glass-card locked" onclick="openModal(2)">
                <span id="lock-2" class="lock-icon">🔒</span>
                <span class="chapter-number">II</span>
                <span class="chapter-title">THE PROTAGONIST</span>
            </div>
            
            <!-- Chapter 3 is locked -->
            <div id="chapter-card-3" class="chapter-card glass-card locked" onclick="openModal(3)">
                <span id="lock-3" class="lock-icon">🔒</span>
                <span class="chapter-number">III</span>
                <span class="chapter-title">THE REVEAL</span>
            </div>
        </div>

        <!-- Button to Reveal Message Section -->
        <button id="show-msg-btn" class="stylized-btn message-trigger-btn" onclick="revealMessageSection()">
            Leave a Message For Me 💌
        </button>

        <!-- Message Section -->
<section id="message-section" class="message-section glass-card hidden">
    <h2>Leave a Message For Me 💌</h2>
    <p>Tell me your thoughts, feelings, or favorite memory after reading everything...</p>
    
    <!-- Replace YOUR_EMAIL@gmail.com with your actual email address -->
    <form action="https://formsubmit.co/YOUR_EMAIL@gmail.com" method="POST" enctype="multipart/form-data" class="message-form">
        <!-- Disables captcha so submission is instant -->
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_subject" value="New Birthday Message from Yashu! 💖">

        <textarea name="message" rows="5" placeholder="Write your heart out here, Yashu..." required></textarea>
        
        <!-- Audio File Upload Input -->
        <div class="file-upload-wrapper">
            <label for="audio-file" class="file-label">🎙️ Optional: Attach a Voice Note or Audio File</label>
            <input type="file" id="audio-file" name="voice_note" accept="audio/*">
        </div>

        <button type="submit" class="stylized-btn">Send Message to Me 💖</button>
    </form>
</section>

    <!-- Dynamic Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content glass-card modal-scrollable">
            <button id="close-btn" class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modal-title">Chapter Title</h2>
            <div id="modal-body" class="modal-body-text"></div>
        </div>
    </div>

    <!-- Audio Settings File -->
    <script src="songs.js"></script>
    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
